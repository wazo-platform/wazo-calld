paths:
  /lines:
    get:
      summary: List line endpoint statuses
      description: |
        **Required ACL:** `calld.lines.read`

        List the status of the lines of the tenant, as wazo-confd lists them

        Supported technologies:

          * SIP

        Lines with unsupported technologies will be listed but there status
        will be null

        The list parameters are passed to wazo-confd's `GET /lines`: `order`
        and `search` use its columns (`context`, `provisioning_code`,
        `provisioning_extension`, `position`, `device_slot`, `protocol`,
        `device_id`, `name`, `caller_id_name`, `caller_id_num`, `exten`;
        sorted by `name` by default). Without `limit`, every line of the
        tenant is returned.
      tags:
        - lines
      parameters:
        - $ref: '#/parameters/TenantUUID'
        - name: limit
          in: query
          type: integer
          minimum: 1
          required: false
          description: Maximum number of items to return in the list
        - $ref: '#/parameters/offset'
        - $ref: '#/parameters/order'
        - $ref: '#/parameters/direction'
        - $ref: '#/parameters/search'
      responses:
        '200':
          description: A list of line status
          schema:
            $ref: '#/definitions/EndpointLines'
        '400':
          $ref: '#/responses/InvalidRequest'
        '503':
          description: Another service is unavailable (`wazo-confd-unreachable`),
            or too many requests to wazo-confd are in flight
            (`wazo-calld-confd-busy`, retry later)
          schema:
            $ref: '#/definitions/Error'
  /trunks:
    get:
      summary: List trunk endpoint statuses
      description: |
        **Required ACL:** `calld.trunks.read`

        List the status of the trunks of the tenant, as wazo-confd lists them

        Supported technologies:

          * SIP

        Trunks with unsupported technologies will be listed but there status
        will be null. A trunk without an endpoint is listed with the
        technology `unknown`, a null name and a null status.

        The list parameters are passed to wazo-confd's `GET /trunks`: `order`
        and `search` use its columns (`id`, `context`, `description`, `name`,
        `label`, `outgoing_caller_id_format`; sorted by `id` by default), where
        `name` is the trunk's name, not its endpoint's. Without `limit`, every
        trunk of the tenant is returned.
      tags:
        - trunks
      parameters:
        - $ref: '#/parameters/TenantUUID'
        - name: limit
          in: query
          type: integer
          minimum: 1
          required: false
          description: Maximum number of items to return in the list
        - $ref: '#/parameters/offset'
        - $ref: '#/parameters/order'
        - $ref: '#/parameters/direction'
        - $ref: '#/parameters/search'
      responses:
        '200':
          description: A list of trunk status
          schema:
            $ref: '#/definitions/EndpointTrunks'
        '400':
          $ref: '#/responses/InvalidRequest'
        '503':
          description: Another service is unavailable (`wazo-confd-unreachable`),
            or too many requests to wazo-confd are in flight
            (`wazo-calld-confd-busy`, retry later)
          schema:
            $ref: '#/definitions/Error'
definitions:
  EndpointLine:
    type: object
    properties:
      technology:
        type: string
        description: The technology of that endpoint only (SIP, SCCP or custom),
          null for a line without an endpoint
      name:
        type: string
        description: The name of that given endpoint in Asterisk
      id:
        type: integer
        description: The ID of the matching confd line
      registered:
        type: boolean
        description: Wether or not this trunk is registered.
      current_call_count:
        type: integer
        description: The number of ongoing calls on that line
  EndpointLines:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/EndpointLine'
      total:
        type: integer
        description: The number of lines matching the searched terms, as
          counted by wazo-confd before paging
      filtered:
        type: integer
        description: Equal to `total`
  EndpointTrunk:
    type: object
    properties:
      technology:
        type: string
        description: The technology of that endpoint only (SIP, IAX or custom),
          `unknown` for a trunk without an endpoint
      name:
        type: string
        description: The name of that given endpoint in Asterisk
      id:
        type: integer
        description: The ID of the matching confd trunk
      registered:
        type: boolean
        description: Wether or not this trunk is registered.
      current_call_count:
        type: integer
        description: The number of ongoing calls on that trunk
  EndpointTrunks:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/EndpointTrunk'
      total:
        type: integer
        description: The number of trunks matching the searched terms, as
          counted by wazo-confd before paging
      filtered:
        type: integer
        description: Equal to `total`
