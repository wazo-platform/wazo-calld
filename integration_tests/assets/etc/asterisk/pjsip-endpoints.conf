; A line and two trunks as wazo-confgend writes them (set_var WAZO_LINE_ID,
; WAZO_TRUNK_ID and __WAZO_TENANT_UUID), and registrations Asterisk sends to
; itself so that the tests can make Registry and PeerStatus events happen.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[line-abc]
type=endpoint
transport=transport-udp
context=default
allow=ulaw
aors=line-abc
set_var=__WAZO_TENANT_UUID=ffffffff-ffff-4c1c-ad1c-ffffffffff01
set_var=WAZO_CHANNEL_DIRECTION=from-wazo
set_var=WAZO_LINE_ID=42

[line-abc]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=1

; trunk 7 registers to the line: a Registry event for trunk 7, a PeerStatus for the line
[trunk-reg]
type=endpoint
transport=transport-udp
context=default
allow=ulaw
set_var=__WAZO_TENANT_UUID=ffffffff-ffff-4c1c-ad1c-ffffffffff01
set_var=WAZO_PAI_FORMAT=
set_var=WAZO_TRUNK_ID=7

[trunk-reg]
type=registration
transport=transport-udp
client_uri=sip:line-abc@127.0.0.1:5060
server_uri=sip:127.0.0.1:5060
line=yes
endpoint=trunk-reg
retry_interval=5

; trunk 8 is registered to by a registration of no endpoint: a PeerStatus for trunk 8
[trunk-peer]
type=endpoint
transport=transport-udp
context=default
allow=ulaw
aors=trunk-peer
set_var=__WAZO_TENANT_UUID=ffffffff-ffff-4c1c-ad1c-ffffffffff01
set_var=WAZO_PAI_FORMAT=
set_var=WAZO_TRUNK_ID=8

[trunk-peer]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=1

[to-trunk-peer]
type=registration
transport=transport-udp
client_uri=sip:trunk-peer@127.0.0.1:5060
server_uri=sip:127.0.0.1:5060
retry_interval=5
